<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>US Residential Proxy Panel</title><style>

body{
    background:
    radial-gradient(circle at top left,#f7f0df 0%,transparent 35%),
    radial-gradient(circle at bottom right,#ece4d0 0%,transparent 35%),
    linear-gradient(135deg,#f4efe3,#e9e2d3);

    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

.card{
    background:rgba(255,255,255,0.45);

.logo{
    width:90px;
    margin-bottom:15px;
}

h1{
    color:#173b68;
    margin:0;

.subtitle{
    color:#666;
    margin-top:10px;
    margin-bottom:25px;
    font-size:14px;
}

.tag{
    color:#1b8a3e;
    font-size:13px;
    margin-bottom:20px;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;

    padding:12px;

    border:none;
    border-radius:12px;

    background:white;

    margin-bottom:15px;

    font-size:14px;
}

input:focus{
    outline:none;
}

button{
    width:100%;

    padding:12px;

    border:none;
    border-radius:12px;

    background:#173b68;

    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.footer{
    margin-top:20px;
    color:#777;
    font-size:12px;
}

</style><script>

    document.getElementById("username").value;

        window.location.href =
