<!DOCTYPE html>
<html>
<head>
<title>US Residential Proxy Panel</title>

<style>

body{
    background:#0d0d0d;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

.card{
    background:#1a1a1a;
    width:350px;
    padding:35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

h1{
    color:white;
    margin-bottom:5px;
    font-size:28px;
}

.subtitle{
    color:#999;
    margin-bottom:25px;
    font-size:14px;
}

.tag{
    color:#4CAF50;
    font-size:13px;
    margin-bottom:20px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2a2a2a;
    color:white;
    margin-bottom:15px;
    font-size:14px;
}

input:focus{
    outline:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.footer{
    margin-top:20px;
    color:#666;
    font-size:12px;
}

</style>

<script>
function login() {

    var pass = document.getElementById("password").value;

    if(pass === "Pararero_482") {
        window.location.href = "dashboard.html";
    } else {
        alert("Incorrect Password");
    }

}
</script>

</head>

<body>

<div class="card">

<h1>US Residential</h1>

<h1>Proxy Panel</h1>

<div class="subtitle">
Private Client Access
</div>

<div class="tag">
Secure Dashboard
</div>

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="login()">
Login
</button>

<div class="footer">
Authorized Access Only
</div>

</div>

</body>
</html>
