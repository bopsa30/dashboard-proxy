<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>US Residential Proxy Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top left,#f7f0df 0%,transparent 35%),
radial-gradient(circle at bottom right,#ece4d0 0%,transparent 35%),
linear-gradient(135deg,#f4efe3,#e9e2d3);
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:350px;
height:350px;
background:rgba(255,255,255,0.35);
filter:blur(90px);
border-radius:50%;
top:-100px;
left:-100px;
}

body::after{
content:"";
position:absolute;
width:300px;
height:300px;
background:rgba(255,255,255,0.25);
filter:blur(90px);
border-radius:50%;
bottom:-100px;
right:-100px;
}

.card{
position:relative;
z-index:2;
width:380px;
max-width:90%;
padding:35px;
text-align:center;
background:rgba(255,255,255,0.35);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.4);
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

.logo{
width:140px;
max-width:100%;
margin-bottom:20px;
}

h1{
color:#173b68;
font-size:28px;
margin-bottom:8px;
font-weight:700;
}

.subtitle{
color:#5f6368;
font-size:14px;
margin-bottom:25px;
letter-spacing:1px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:white;
font-size:14px;
margin-bottom:15px;
}

input:focus{
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#173b68;
color:white;
font-weight:bold;
font-size:15px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:translateY(-2px);
}

.footer{
margin-top:18px;
font-size:12px;
color:#777;
}

</style>

<script>

function login(){

var pass=document.getElementById("password").value;

if(pass==="Pararero_482"){
window.location.href="dashboard.html";
}
else{
alert("Incorrect Password");
}

}

</script>

</head>

<body>

<div class="card">

<img src="1780308231419.png" class="logo">

<h1>US Residential Proxy Panel</h1>

<div class="subtitle">
PRIVATE CLIENT ACCESS
</div>

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="login()">
Login
</button>

<div class="footer">
Secure Access
</div>

</div>

</body>
</html>
