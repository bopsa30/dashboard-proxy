<!DOCTYPE html>
<html>
<head>
<title>US Residential Proxy Dashboard</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.card{
    max-width:700px;
    margin:auto;
    background:#1a1a1a;
    padding:20px;
    border-radius:15px;
}

.proxy{
    background:#222;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

button{
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.status{
    color:#4CAF50;
    font-weight:bold;
}
</style>

<script>

const lastUpdate = "01 June 2026 - 09:15 WIB";

const proxies = [
"US_PROXY_1",
"US_PROXY_2",
"US_PROXY_3",
"US_PROXY_4",
"US_PROXY_5"
];

function copyProxy(index){
    navigator.clipboard.writeText(proxies[index]);
    alert("Proxy copied!");
}

window.onload = function(){

    document.getElementById("updateTime").innerText = lastUpdate;

    let html = "";

    for(let i=0;i<proxies.length;i++){

        html += `
        <div class="proxy">
            <h3>US Proxy #${i+1}</h3>

            <button onclick="copyProxy(${i})">
                Copy
            </button>
        </div>
        `;
    }

    document.getElementById("proxyList").innerHTML = html;
}
</script>

</head>

<body>

<div class="card">

<h1>US Residential Proxy Dashboard</h1>

<p>
<span class="status">🟢 Active</span>
</p>

<p>
Daily Refresh
</p>

<p>
5 Available Proxies
</p>

<p>
Last Updated:
<span id="updateTime"></span>
</p>

<hr>

<div id="proxyList"></div>

<hr>

<p>
Need Help?
</p>

<p>
Telegram @systemsbad
</p>

</div>

</body>
</html>
