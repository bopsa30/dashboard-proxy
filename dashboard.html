<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>US Residential Proxy Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top left,#f7f0df 0%,transparent 35%),
radial-gradient(circle at bottom right,#ece4d0 0%,transparent 35%),
linear-gradient(135deg,#f4efe3,#e9e2d3);
padding:20px;
min-height:100vh;
}

.container{
max-width:900px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:30px;
}

.logo{
width:120px;
margin-bottom:15px;
}

h1{
color:#173b68;
margin-bottom:10px;
}

.status{
display:inline-block;
padding:8px 15px;
border-radius:20px;
background:#dff7e6;
color:#1b8a3e;
font-weight:bold;
margin-bottom:15px;
}

.info{
color:#666;
font-size:14px;
margin-top:8px;
}

.proxy-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:25px;
}

.proxy-card{
background:rgba(255,255,255,0.45);
backdrop-filter:blur(15px);
border-radius:18px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.proxy-title{
font-weight:bold;
color:#173b68;
margin-bottom:10px;
}

.proxy-value{
background:white;
padding:10px;
border-radius:10px;
font-size:13px;
word-break:break-all;
margin-bottom:10px;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#173b68;
color:white;
font-weight:bold;
cursor:pointer;
}

.support{
margin-top:35px;
text-align:center;
background:rgba(255,255,255,0.4);
padding:20px;
border-radius:18px;
}

.support h3{
margin-bottom:10px;
color:#173b68;
}

.loading{
text-align:center;
color:#173b68;
margin-top:30px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="1780308231419.png" class="logo">

<h1>US Residential Proxy Dashboard</h1>

<div class="status">
🟢 ACTIVE
</div>

<div class="info">
Daily Refresh
</div>

<div class="info">
<span id="proxyCount">0</span> Available Proxies
</div>

<div class="info">
Last Updated Automatically From Google Sheet
</div>

</div>

<div id="loading" class="loading">
Loading Proxies...
</div>

<div id="proxyGrid" class="proxy-grid">
</div>

<div class="support">

<h3>Need Help?</h3>

Telegram:
@username

</div>

</div>

<script>

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQgHscNUI4lyusus6NGDx52tJj9ZMk1v4YC9ODI42aXlamQkkhbQShoU2diDgKkgj4jURhuYzBY39R3/pub?gid=0&single=true&output=csv";

function copyProxy(proxy,button){

navigator.clipboard.writeText(proxy);

button.innerText="Copied ✓";

setTimeout(()=>{
button.innerText="Copy";
},2000);

}

fetch(csvUrl)

.then(response => response.text())

.then(data => {

const rows =
data.split("\n")
.map(row => row.trim())
.filter(row => row !== "");

const proxies = rows.slice(1);

document.getElementById("proxyCount").innerText =
proxies.length;

document.getElementById("loading").style.display =
"none";

const grid =
document.getElementById("proxyGrid");

proxies.forEach((proxy,index)=>{

const card =
document.createElement("div");

card.className="proxy-card";

card.innerHTML=`

<div class="proxy-title">
US Proxy #${index+1}
</div>

<div class="proxy-value">
${proxy}
</div>

<button>
Copy
</button>

`;

const btn =
card.querySelector("button");

btn.addEventListener("click",()=>{

copyProxy(proxy,btn);

});

grid.appendChild(card);

});

})

.catch(error=>{

document.getElementById("loading").innerHTML =
"Failed to load proxies from Google Sheets";

console.error(error);

});

</script>

</body>
</html>
