<!DOCTYPE html>
<html>
<head>
<title>US Proxy Dashboard</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.card{
    max-width:700px;
    margin:auto;
    background:#1a1a1a;
    padding:20px;
    border-radius:15px;
}

.proxy{
    background:#222;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

button{
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.status{
    color:#4CAF50;
    font-weight:bold;
}
</style>

<script>

const lastUpdate = "31 May 2026 - 14:30 WIB";

const proxies = [
"1.1.1.1:8000:user1:pass1",
"1.1.1.2:8000:user2:pass2",
"1.1.1.3:8000:user3:pass3",
"1.1.1.4:8000:user4:pass4",
"1.1.1.5:8000:user5:pass5"
];

function copyProxy(index){
    navigator.clipboard.writeText(proxies[index]);
    alert("Proxy copied!");
}

window.onload = function(){

    document.getElementById("updateTime").innerText = lastUpdate;

    let html = "";

    for(let i=0;i<proxies.length;i++){

        html += `
        <div class="proxy">
            <h3>US Proxy #${i+1}</h3>

            <p>${proxies[i]}</p>

            <button onclick="copyProxy(${i})">
                Copy Proxy
            </button>
        </div>
        `;
    }

    document.getElementById("proxyList").innerHTML = html;
}
</script>

</head>

<body>

<div class="card">

<h1>US Proxy Dashboard</h1>

<p>
Status:
<span class="status">ACTIVE</span>
</p>

<p>
Last Updated:
<span id="updateTime"></span>
</p>

<div id="proxyList"></div>

<br>

<p>
Support: Telegram @username
</p>

</div>

</body>
</html>
